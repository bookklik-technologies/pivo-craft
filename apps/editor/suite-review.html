<!doctype html><html><head><meta charset="utf-8"><title>PiVo responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#64748b;font:13px system-ui}header{height:40px;background:#fff;display:flex;gap:12px;align-items:center;padding:4px 12px}main{overflow:visible;padding:12px}iframe{border:0;display:block;transform-origin:top left;background:#151a22}button,select{height:30px}</style></head><body><header><label>Viewport <select id="size"><option>1440×900</option><option>1280×720</option><option>1024×768</option><option>800×700</option></select></label><label>Content scale <select id="scale"><option value="1">100%</option><option value="2">200% equivalent</option></select></label><span id="report"></span></header><main><iframe title="Editor review" src="/"></iframe></main><script>
const params=new URLSearchParams(location.search),size=document.querySelector('#size'),scale=document.querySelector('#scale'),frame=document.querySelector('iframe');size.value=params.get('size')||'1280×720';scale.value=params.get('scale')||'1';function update(){const [w,h]=size.value.split('×').map(Number),z=Number(scale.value);frame.style.width=w/z+'px';frame.style.height=h/z+'px';frame.style.transform='scale('+z+')';document.querySelector('#report').textContent='Editor viewport '+w/z+' × '+h/z+' CSS pixels; output '+w+' × '+h;document.querySelector('main').style.height=h+24+'px';document.querySelector('main').style.width=w+24+'px';}size.onchange=scale.onchange=update;update();</script></body></html>
