name: Manual unit validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate explicitly selected commit
        run: npm test
      - name: Record validated commit
        run: git rev-parse HEAD > unit-validation-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unit-validation-${{ github.sha }}
          path: unit-validation-commit.txt
