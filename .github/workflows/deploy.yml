name: Validate and release app and docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:suite
      - run: npm run check:dependencies
      - name: Unit validation authorized by manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - run: npm run build
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
      - run: npm run build:standalone
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:workers
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: npm run test:menus
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: npm run test:standalone
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: npm run capture:predecessor
      - run: npm run test:upgrade
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Combine verified app and docs
        run: |
          mkdir -p dist/docs
          cp -a docs/.vitepress/dist/. dist/docs/
          git rev-parse HEAD > dist/release-commit.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-evidence
          path: test-results/readiness
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
